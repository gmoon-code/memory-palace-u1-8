name: Apply Z2 QA fixes

on:
  push:
    branches:
      - story-revision/unit1-pilot
    paths:
      - .github/workflows/apply-z2-qa-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact-name narrative fixes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('content/ap-biology/unit-1/journeys/Z2.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          trace_scene = data['scenes'][1]
          old = 'A **trace element** is required in a very small quantity.'
          new = '**Trace elements** are required in very small quantities.'
          trace_scene['story_paragraphs'] = [p.replace(old, new) for p in trace_scene['story_paragraphs']]

          bond_scene = data['scenes'][5]
          anchor = "The display finally supplies the term **ELECTRONEGATIVITY**. **Electronegativity** is a measure of an atom's ability to attract electrons toward itself. The electron cloud has already shown you what the word means."
          addition = " The atom pair remains connected while that distribution shifts. A small status strip beneath it reads **CHEMICAL BOND — INTACT**. A **chemical bond** is an attraction that holds atoms or ions together; here, the atoms remain connected through shared electrons."
          bond_scene['story_paragraphs'] = [p if anchor not in p or '**CHEMICAL BOND — INTACT**' in p else p + addition for p in bond_scene['story_paragraphs']]

          for scene in data['scenes']:
              scene['story_open'] = scene['story_paragraphs'][0]
              scene['story_close'] = scene['story_paragraphs'][-1]

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Confirm the two QA anchors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('content/ap-biology/unit-1/journeys/Z2.json').read_text(encoding='utf-8'))
          assert '**Trace elements**' in ' '.join(data['scenes'][1]['story_paragraphs'])
          assert '**CHEMICAL BOND — INTACT**' in ' '.join(data['scenes'][5]['story_paragraphs'])
          print('Z2 QA fixes ready')
          PY
      - name: Commit QA fixes to the pilot branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/ap-biology/unit-1/journeys/Z2.json
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix Z2 exact-name narrative anchors'
            git push
          fi
