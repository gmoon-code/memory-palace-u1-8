name: Memory Palace QA
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python scripts/build_site_ux1.py
      - run: python scripts/verify_content.py
      - run: python scripts/qa_unit1_full.py
      - run: python scripts/qa_unit2_f5.py
      - run: python scripts/qa_unit3_f6.py
      - run: python scripts/qa_unit4_f6.py
      - run: python scripts/qa_unit5_f6.py
      - run: python scripts/qa_mainline_u1_u3.py
      - run: python scripts/qa_mainline_u1_u4.py
      - run: python scripts/qa_mainline_u1_u5.py
      - run: python scripts/qa_unit6_f1.py
      - run: python scripts/qa_unit6_f2.py
      - run: python scripts/qa_unit6_f3.py
      - run: python scripts/qa_unit6_f4a.py
      - run: python scripts/qa_unit6_f4b.py
      - run: python scripts/qa_unit6_f4c.py
      - run: python scripts/qa_unit6_f4d.py
      - run: python scripts/qa_unit6_f4e.py
      - run: python scripts/qa_unit6_f4f.py
      - run: python scripts/qa_unit6_f5.py
      - run: python scripts/qa_unit6_f6.py
      - run: python scripts/qa_mainline_u1_u6.py
      - run: python scripts/qa_unit7_f1.py
      - run: python scripts/qa_unit7_f2.py
      - run: python scripts/qa_unit7_f3.py
      - run: python scripts/qa_unit7_f4a.py
      - run: python scripts/qa_unit7_f4b.py
      - run: python scripts/qa_unit7_f4c.py
      - run: python scripts/qa_unit7_f4d.py
      - run: python scripts/qa_unit7_f4e.py
      - run: python scripts/qa_unit7_f4f.py
      - run: python scripts/qa_unit7_f5.py
      - run: python scripts/qa_unit7_f6.py
      - run: node scripts/qa_unit7_f6_ui.mjs
      - run: python scripts/qa_mainline_u1_u7.py
      - run: python scripts/qa_unit8_f3.py
      - run: python scripts/qa_unit8_f4a.py
      - run: python scripts/qa_unit8_f4b.py
      - run: python scripts/qa_unit8_f4c.py
      - run: python scripts/qa_unit8_f4d.py
      - run: python scripts/qa_unit8_f4e.py
      - run: python scripts/qa_unit8_f4f.py
      - run: python scripts/qa_unit8_f4g.py
      - run: python scripts/qa_unit8_f4h.py
      - run: python scripts/qa_unit8_f5.py
      - run: node scripts/qa_unit8_f5_ui.mjs
      - run: python scripts/qa_unit8_f6.py
      - run: node scripts/qa_unit8_f6_ui.mjs
      - run: python scripts/qa_mainline_u1_u8.py
      - run: node scripts/qa_unit3_f6_ui.mjs
      - run: node scripts/qa_unit4_f6_ui.mjs
      - run: node scripts/qa_unit5_f6_ui.mjs
      - run: node scripts/qa_unit6_f6_ui.mjs
      - run: node scripts/qa_site_ux.mjs
      - run: python scripts/qa_admin_foundation.py
      - run: python scripts/qa_admin_catalog.py
      - run: python scripts/qa_admin_drafts.py
      - run: python scripts/qa_admin_editors.py
      - run: python scripts/qa_admin_replacements.py
      - run: python scripts/qa_admin_management.py
      - run: python scripts/qa_admin_quality.py
      - run: python scripts/qa_admin_publication.py
      - run: python scripts/qa_content_studio_integration.py
      - run: python scripts/qa_zero_cost_rehearsal.py
      - run: python scripts/qa_zero_cost_runtime.py
      - run: python scripts/qa_zero_cost_windows_launcher.py
      - run: python scripts/qa_zero_cost_backup_restore.py
      - run: python scripts/qa_zero_cost_local_updater.py
      - run: python scripts/qa_content_studio_health_repair.py
      - run: python scripts/qa_content_studio_teacher_distribution.py
      - run: python scripts/qa_admin_capability_audit.py
      - run: python scripts/qa_admin_workflow.py
      - run: python scripts/qa_admin_e2e_usability.py
      - run: python scripts/qa_content_studio_release_candidate.py
      - run: python scripts/qa_content_studio_rc1_clean_rehearsal.py
      - run: python scripts/qa_content_studio_stable_release.py
      - run: docker build -f deploy/content-studio/Dockerfile -t story-method-content-studio:ci .
      - name: Smoke production Content Studio container with admin gates off
        run: |
          docker run -d --name content-studio-ci -p 127.0.0.1:8765:8000 story-method-content-studio:ci
          trap 'docker logs content-studio-ci || true; docker rm -f content-studio-ci || true' EXIT
          python scripts/qa_content_studio_container.py
      - run: python scripts/build_github_pages.py --output /tmp/memory-palace-pages-a
      - run: PAGES_SITE_ROOT=/tmp/memory-palace-pages-a node scripts/qa_github_pages_static.mjs
      - run: python scripts/build_github_pages.py --output /tmp/memory-palace-pages-b
      - run: diff -qr /tmp/memory-palace-pages-a /tmp/memory-palace-pages-b
      - run: python scripts/qa_site_contrast.py
      - run: python scripts/qa_site_http_live.py
      - run: python -m pytest -q
      - run: node --check frontend/js/app.js
      - run: node --check frontend/js/api.js
      - run: node --check frontend/js/state.js
      - run: node --check frontend/js/audio.js
      - run: node --check frontend/js/site-controls.js
      - run: node --check frontend/js/views/home.js
      - run: node --check frontend/js/views/learn.js
      - run: node --check frontend/js/views/review.js
      - run: node --check frontend/js/views/practice.js
      - run: node --check frontend/admin/admin.js
      - run: node --check frontend/admin/drafts.js
      - run: node --check frontend/admin/editor.js
      - run: node --check frontend/admin/replacement.js
      - run: node --check frontend/admin/management.js
      - run: node --check frontend/admin/quality.js
      - run: node --check frontend/admin/publication.js
      - run: node --check frontend/admin/health-repair.js
      - run: node --check frontend/admin/capability-audit.js
      - run: node --check frontend/admin/workflow.js
      - run: node --check frontend/admin/usability.js
      - run: node --check scripts/qa_github_pages_static.mjs
      - run: python -m compileall -q backend scripts tests
      - run: python scripts/build_site_ux1_release.py --output /tmp/site-ux1-a.zip
      - run: python scripts/build_site_ux1_release.py --output /tmp/site-ux1-b.zip
      - run: cmp /tmp/site-ux1-a.zip /tmp/site-ux1-b.zip
      - name: Verify no source drift outside generated release evidence
        run: >-
          git diff --exit-code -- .
          ':(exclude)site-release/site-ux1-lock.json'
          ':(exclude)docs/SITE_UX1_PACKAGE_MANIFEST.json'
